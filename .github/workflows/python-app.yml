# This workflow validates hw-test (pc-test based Python layout).

name: Python application

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run check-scripts.sh
        run: ./check-scripts.sh

      - name: Run unit tests
        env:
          PYTHONPATH: python3
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v

  check-spec:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Check spec file syntax
        run: |
          test -f .gear/hw-test.spec
          grep -q '^Name:' .gear/hw-test.spec
          grep -q '^Version:' .gear/hw-test.spec
          grep -q '^Release:' .gear/hw-test.spec
          grep -q '^Summary:' .gear/hw-test.spec
