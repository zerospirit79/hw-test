[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hw-test"
version = "2.2.0"
description = "Hardware compatibility testing tool for ALT Linux (based on pc-test / Basalt SPo methodology)"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.9"
authors = [
    { name = "Pavel Shilov", email = "zerospirit@altlinux.org" },
]
keywords = ["altlinux", "hardware", "testing", "compatibility", "benchmark"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Hardware",
    "Topic :: System :: Benchmark",
]
dependencies = [
    "psutil>=5.9.0",
    "py-cpuinfo>=9.0.0",
    "packaging>=21.0",
    "pexpect>=4.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "ruff>=0.4.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]

[project.urls]
Homepage = "https://github.com/zerospirit79/hw-test"
Repository = "https://github.com/zerospirit79/hw-test"
Documentation = "https://www.basealt.ru/product-compatibility"

[project.scripts]
hw-test = "hw_test.main:main"

[tool.setuptools.packages.find]
where = ["python3"]

[tool.ruff]
target-version = "py39"
line-length = 99
src = ["python3"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
]
ignore = [
    "E501",
    "B007",
    "B008",
    "UP006",
    "UP035",
    "UP045",
    "UP007",
]

[tool.ruff.lint.isort]
known-first-party = ["hw_test"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python3"]
